<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BladeRondo">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
:root{--bg:#0e1424;--panel:#141b31;--gold:#c9a45c;--gold2:#f2dda0;--ink:#ece6d4;--dim:#8d94a8;
--red:#8c2a30;--green:#1e6b4f;--blue:#243f9c;--tl:#e9e7e2;--td:#3b3b40;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Cinzel","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:8px 10px;background:var(--panel)}
#p2{transform:rotate(180deg)}
.gems{display:flex;justify-content:space-around;align-items:flex-start}
.gem{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{width:min(24vw,96px);aspect-ratio:1;border-radius:50%;border:4px solid var(--gold);cursor:pointer;color:#fff;
font:700 clamp(24px,8vw,38px) "Cinzel",Georgia,serif;display:grid;place-items:center;
box-shadow:0 0 0 2px #0006,inset 0 0 14px #000a;outline-offset:3px}
.ring.a{background:radial-gradient(circle at 35% 30%,#b04148,var(--red) 60%,#4a1518)}
.ring.v{background:radial-gradient(circle at 35% 30%,#2f9a74,var(--green) 60%,#0d3a2a)}
.ring.d{background:radial-gradient(circle at 35% 30%,#4a6ad8,var(--blue) 60%,#0f1f55)}
.name{font-size:12px;color:var(--gold2);letter-spacing:.06em}
.adj{display:flex;gap:6px}
button{font:inherit;color:var(--ink);background:#232c4a;border:1px solid #3a4568;border-radius:8px;min-width:44px;min-height:40px;cursor:pointer}
button:active{background:#33406a}
button:focus-visible,.ring:focus-visible,.tile:focus-visible{outline:2px solid var(--gold2)}
.lifebar{display:flex;align-items:center;justify-content:center;gap:12px}
.lifebar .n{min-width:64px;text-align:center;font-size:34px;font-weight:700;color:var(--gold2)}
.lifebar .l{font-size:12px;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.tile{padding:0;min-width:0;min-height:30px;border-radius:3px;border:1px solid #0008;font-size:13px;color:#222;background:var(--tl);opacity:.28}
.tile.k{background:var(--td);color:#ddd}
.tile.z{background:#000;color:#eee}
.tile.on{opacity:1}
.tile.cur{outline:2px solid var(--gold);outline-offset:1px}
.mid{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;border-block:2px solid var(--gold);background:#0a0f1d}
.mid b{color:var(--gold2);letter-spacing:.14em;font-size:15px}
.mid button{min-height:34px;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <section class="panel" id="p2"></section>
  <div class="mid"><b>BLADE RONDO</b><button id="reset">リセット</button></div>
  <section class="panel" id="p1"></section>
</div>
<script>
const LIFE_MAX=15, GEM_MAX=9, KEY="bladerondo-tracker-v2";
const clamp=(x,lo,hi)=>Math.max(lo,Math.min(hi,x));
const fresh=()=>[{life:LIFE_MAX,a:0,v:0,d:0},{life:LIFE_MAX,a:0,v:0,d:0}];
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s)&&s.length===2)S=s.map(p=>({life:clamp(+p.life||0,0,LIFE_MAX),a:clamp(+p.a||0,0,GEM_MAX),v:clamp(+p.v||0,0,GEM_MAX),d:clamp(+p.d||0,0,GEM_MAX)}))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const GEMS=[["a","Attack"],["v","Voltage"],["d","Defence"]];
const els=[];

function build(i){
  const root=document.getElementById("p"+(i+1)); const e={};
  const gems=document.createElement("div"); gems.className="gems";
  GEMS.forEach(([k,label])=>{
    const g=document.createElement("div"); g.className="gem";
    const r=document.createElement("button"); r.className="ring "+k;
    r.setAttribute("aria-label",label+" +1");
    r.onclick=()=>{S[i][k]=Math.min(GEM_MAX,S[i][k]+1);draw()};
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=label;
    const adj=document.createElement("div"); adj.className="adj";
    const m=document.createElement("button"); m.textContent="−"; m.setAttribute("aria-label",label+" −1");
    const p=document.createElement("button"); p.textContent="+"; p.setAttribute("aria-label",label+" +1");
    m.onclick=()=>{S[i][k]=Math.max(0,S[i][k]-1);draw()};
    p.onclick=()=>{S[i][k]=Math.min(GEM_MAX,S[i][k]+1);draw()};
    adj.append(m,p); g.append(r,nm,adj); gems.append(g); e[k]=r;
  });
  const bar=document.createElement("div"); bar.className="lifebar";
  const lm=document.createElement("button"); lm.textContent="−"; lm.setAttribute("aria-label","ライフ −1");
  const lp=document.createElement("button"); lp.textContent="+"; lp.setAttribute("aria-label","ライフ +1");
  const ln=document.createElement("div"); ln.className="n";
  const ll=document.createElement("div"); ll.className="l"; ll.textContent="Life";
  lm.onclick=()=>{S[i].life=clamp(S[i].life-1,0,LIFE_MAX);draw()};
  lp.onclick=()=>{S[i].life=clamp(S[i].life+1,0,LIFE_MAX);draw()};
  bar.append(lm,ln,lp,ll); e.life=ln;
  const tiles=document.createElement("div"); tiles.className="tiles"; e.tiles=[];
  const order=[8,9,10,11,12,13,14,15,0,1,2,3,4,5,6,7];
  for(const n of order){
    const row=n>=8?0:1, col=n%8;
    const t=document.createElement("button"); t.className="tile"+((row+col)%2?" k":"")+(n===0?" z":""); t.textContent=n;
    t.setAttribute("aria-label","ライフを "+n+" にする");
    t.onclick=()=>{S[i].life=n;draw()};
    tiles.append(t); e.tiles[n]=t;
  }
  root.append(gems,bar,tiles); els[i]=e;
}

function draw(){
  S.forEach((p,i)=>{
    const e=els[i];
    GEMS.forEach(([k])=>e[k].textContent=p[k]);
    e.life.textContent=p.life;
    e.tiles.forEach((t,n)=>{t.classList.toggle("on",n<=p.life);t.classList.toggle("cur",n===p.life)});
  });
  save();
}

let armed=null; const rb=document.getElementById("reset");
rb.onclick=()=>{
  if(!armed){rb.textContent="もう一度タップで確定";armed=setTimeout(()=>{armed=null;rb.textContent="リセット"},2500);return}
  clearTimeout(armed);armed=null;rb.textContent="リセット";S=fresh();draw();
};

build(0);build(1);draw();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
